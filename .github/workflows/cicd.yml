name: iOS CI

on:
  push:
    branches: [main, development, ci_cd]
  pull_request:
    branches: [main, development, ci_cd]

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3.0
        bundler-cache: true

    - name: Install dependencies
      run: |
        gem install fastlane
        gem install abbrev  # Fix the warning

    - name: List available simulators
      run: xcrun simctl list devices

    - name: Create iPhone 16 Pro simulator with iOS 18.5
      run: |
        # Delete existing simulator if it exists
        xcrun simctl delete "iPhone 16 Pro CI" || true
        # Create new simulator with specific runtime
        xcrun simctl create "iPhone 16 Pro CI" "iPhone 16 Pro" com.apple.CoreSimulator.SimRuntime.iOS-18-5

    - name: Run Unit Tests
      run: bundle exec fastlane unit_test
      env:
        FASTLANE_SKIP_UPDATE_CHECK: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          fastlane/test_output/
        retention-days: 7

    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs
        path: |
          fastlane/build_logs/
        retention-days: 7
